<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>图片压缩 · Image Compressor（本地批量，不上传）</title>
<meta name="description" content="批量压缩图片：智能选格式（PNG 转 WebP 更小）、按目标体积二分逼近、限制最长边、透明区自动垫白底，全部在浏览器本地完成，图片不上传。" />
<meta property="og:title" content="图片压缩 · Image Compressor" />
<meta property="og:description" content="批量压缩：智能格式 / 目标体积二分逼近 / 限制边长 / 透明垫白底，纯本地处理。" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%232563eb' stroke-width='1.9' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='4' width='18' height='16' rx='2.5'/%3E%3Cpath d='M3 15l4.5-4.5 4 4 3-3L21 16'/%3E%3Ccircle cx='8.5' cy='9' r='1.4'/%3E%3C/svg%3E" />
<style>
[hidden] { display: none !important; }

:root {
  --bg: #f5f6fa; --surface: #fff; --surface2: #f2f4f9; --surface3: #e9edf6;
  --text: #1b2130; --muted: #6b7385; --border: #e2e6ef;
  --primary: #2563eb; --purple: #7c3aed; --ok: #17a673; --warn: #d97706; --danger: #e11d48;
  --shadow: 0 8px 28px rgba(23, 32, 64, .08);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0d1017; --surface: #151a24; --surface2: #1b2130; --surface3: #232b3a;
    --text: #e8ecf4; --muted: #8b93a7; --border: #262d3b;
    --shadow: 0 10px 34px rgba(0, 0, 0, .45);
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text); min-height: 100vh;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  font-size: 14px; line-height: 1.6; -webkit-font-smoothing: antialiased;
}
.page { max-width: 1080px; margin: 0 auto; padding: 26px 20px 56px; }

.head h1 { margin: 0 0 6px; font-size: 26px; }
.head p { margin: 0 0 20px; color: var(--muted); max-width: 760px; }
.head b { color: var(--text); }

/* ---------- 控制条 ---------- */
.controls {
  display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
  padding: 16px 18px; box-shadow: var(--shadow);
}
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label { font-size: 12px; color: var(--muted); font-weight: 600; letter-spacing: .2px; }
select, input[type="number"] {
  background: var(--surface2); color: var(--text); border: 1px solid var(--border);
  border-radius: 9px; padding: 8px 10px; font-size: 13.5px; font-family: inherit;
  min-width: 108px; outline: none;
}
select:focus, input:focus { border-color: var(--primary); }
input[type="range"] { width: 150px; accent-color: var(--primary); }
.q-wrap { display: flex; align-items: center; gap: 8px; }
.q-val { font-variant-numeric: tabular-nums; font-size: 13px; color: var(--text); min-width: 34px; }
.target-wrap { display: flex; align-items: center; gap: 6px; }
.target-wrap input { width: 82px; }
.target-wrap .unit { color: var(--muted); font-size: 13px; }
.chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
.chk input { accent-color: var(--primary); }

.spacer { flex: 1; }
.btn {
  border: 1px solid var(--border); background: var(--surface2); color: var(--text);
  border-radius: 9px; padding: 9px 16px; font-size: 13.5px; font-weight: 600;
  cursor: pointer; font-family: inherit; white-space: nowrap;
}
.btn:hover { background: var(--surface3); }
.btn.primary {
  background: linear-gradient(135deg, var(--primary), var(--purple));
  border: none; color: #fff;
}
.btn.primary:hover { filter: brightness(1.08); }
.btn.tiny { padding: 5px 10px; font-size: 12.5px; }

/* ---------- 拖拽区 ---------- */
.drop {
  margin-top: 16px; border: 1.5px dashed var(--border); border-radius: 16px;
  background: var(--surface); padding: 34px 20px; text-align: center; cursor: pointer;
  transition: border-color .18s, background .18s;
}
.drop:hover, .drop.drag { border-color: var(--primary); background: color-mix(in srgb, var(--primary) 5%, var(--surface)); }
.drop .ico { font-size: 30px; line-height: 1; margin-bottom: 10px; color: var(--primary); }
.drop h2 { margin: 0 0 4px; font-size: 16.5px; }
.drop p { margin: 0; color: var(--muted); font-size: 13px; }

/* ---------- 汇总 ---------- */
.summary {
  margin-top: 14px; display: flex; gap: 20px; flex-wrap: wrap; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 18px; font-size: 13.5px;
}
.summary b { font-variant-numeric: tabular-nums; }
.summary .save { color: var(--ok); font-weight: 700; }

/* ---------- 列表 ---------- */
.list { margin-top: 14px; display: flex; flex-direction: column; gap: 10px; }
.item {
  display: grid; grid-template-columns: 76px minmax(0, 1fr) auto;
  gap: 14px; align-items: center;
  background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
  padding: 12px 14px;
}
.thumb {
  width: 76px; height: 76px; border-radius: 10px; overflow: hidden;
  background: repeating-conic-gradient(var(--surface3) 0% 25%, var(--surface2) 0% 50%) 50% / 12px 12px;
  display: grid; place-items: center; flex: none;
}
.thumb img { width: 100%; height: 100%; object-fit: contain; }
.meta { min-width: 0; }
.meta .name {
  font-weight: 600; font-size: 13.5px; white-space: nowrap; overflow: hidden;
  text-overflow: ellipsis; margin-bottom: 3px;
}
.meta .nums { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.meta .nums .arrow { margin: 0 6px; }
.meta .nums .out { color: var(--text); font-weight: 600; }
.meta .nums .pct { color: var(--ok); font-weight: 700; }
.meta .tip { color: var(--warn); font-size: 12px; margin-top: 3px; }
.badge {
  display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px;
  background: var(--surface3); color: var(--muted); margin-left: 6px; font-weight: 600;
}
.badge.work { background: color-mix(in srgb, var(--primary) 16%, transparent); color: var(--primary); }
.badge.err { background: color-mix(in srgb, var(--danger) 16%, transparent); color: var(--danger); }
.acts { display: flex; gap: 6px; flex: none; }

/* ---------- 对比弹窗 ---------- */
.mask {
  position: fixed; inset: 0; background: rgba(8, 11, 20, .62); backdrop-filter: blur(3px);
  display: grid; place-items: center; z-index: 60; padding: 20px;
}
.modal {
  width: min(860px, 96vw); max-height: 92vh; overflow: auto; background: var(--surface);
  border: 1px solid var(--border); border-radius: 18px; padding: 20px 22px;
  box-shadow: 0 24px 60px rgba(0, 0, 0, .4);
}
.modal h3 { margin: 0 0 14px; font-size: 16px; }
.cmp {
  position: relative; overflow: hidden; border-radius: 12px; background:
  repeating-conic-gradient(var(--surface3) 0% 25%, var(--surface2) 0% 50%) 50% / 16px 16px;
  user-select: none; touch-action: none;
}
.cmp img { display: block; width: 100%; height: auto; }
.cmp .after { position: absolute; inset: 0; overflow: hidden; }
.cmp .after img { width: 100%; }
.cmp .bar {
  position: absolute; top: 0; bottom: 0; width: 2px; background: #fff;
  box-shadow: 0 0 0 1px rgba(0, 0, 0, .3); transform: translateX(-1px);
}
.cmp .bar::after {
  content: ''; position: absolute; top: 50%; left: 50%; width: 30px; height: 30px;
  transform: translate(-50%, -50%); border-radius: 50%; background: #fff;
  box-shadow: 0 2px 10px rgba(0, 0, 0, .35);
}
.cmp .tag {
  position: absolute; top: 8px; padding: 2px 9px; border-radius: 999px;
  background: rgba(0, 0, 0, .55); color: #fff; font-size: 11.5px; font-weight: 600;
}
.cmp .tag.l { left: 8px; }
.cmp .tag.r { right: 8px; }
.fmt-table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
.fmt-table th, .fmt-table td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--border); }
.fmt-table th { color: var(--muted); font-weight: 600; font-size: 12px; }
.fmt-table td.n { font-variant-numeric: tabular-nums; }

.foot {
  margin-top: 32px; padding-top: 16px; border-top: 1px solid var(--border);
  display: flex; gap: 12px; justify-content: center; flex-wrap: wrap;
  color: var(--muted); font-size: 12.5px;
}
.foot a { color: var(--primary); text-decoration: none; }
.foot a:hover { text-decoration: underline; }
</style>
</head>
<body>
<div class="page">

  <header class="head">
    <h1>图片压缩</h1>
    <p>
      批量把图片压到更小：<b>智能选格式</b>（PNG 自动转 WebP，保透明又更小）、<b>按目标体积二分逼近</b>、
      <b>限制最长边</b>、透明图转 JPG 时自动垫白底。全程在浏览器本地处理，图片不上传。
    </p>
  </header>

  <section class="controls">
    <div class="field">
      <label>输出格式</label>
      <select id="fmt">
        <option value="smart">智能（推荐）</option>
        <option value="keep">保持原格式</option>
        <option value="image/jpeg">JPG</option>
        <option value="image/webp">WebP</option>
        <option value="image/png">PNG</option>
      </select>
    </div>
    <div class="field">
      <label>最长边</label>
      <select id="dim">
        <option value="0">原图尺寸</option>
        <option value="3840">4K · 3840</option>
        <option value="2560">2K · 2560</option>
        <option value="1920">1920</option>
        <option value="1280">1280</option>
        <option value="800">800</option>
      </select>
    </div>
    <div class="field">
      <label>质量</label>
      <div class="q-wrap">
        <input type="range" id="q" min="10" max="100" value="75" />
        <span class="q-val" id="qVal">75</span>
      </div>
    </div>
    <div class="field">
      <label>目标体积</label>
      <div class="target-wrap">
        <label class="chk"><input type="checkbox" id="tOn" /> 限制在</label>
        <input type="number" id="tKB" min="5" max="20000" value="200" />
        <span class="unit">KB</span>
      </div>
    </div>
    <div class="spacer"></div>
    <button class="btn primary" id="addBtn">选择图片</button>
  </section>

  <div class="drop" id="drop">
    <div class="ico">⊕</div>
    <h2>把图片拖到这里</h2>
    <p>也可以 <b>Ctrl+V 粘贴</b> 截图 · 支持 JPG / PNG / WebP / AVIF / GIF 首帧 · 可一次多张</p>
  </div>
  <input type="file" id="file" accept="image/*" multiple hidden />

  <div class="summary" id="summary" hidden>
    <span>已完成 <b id="sCount">0</b> 张</span>
    <span>原始 <b id="sOrig">0</b></span>
    <span>压缩后 <b id="sOut">0</b></span>
    <span class="save">省下 <b id="sSave">0%</b></span>
    <div class="spacer"></div>
    <button class="btn tiny" id="dlAll">全部下载</button>
    <button class="btn tiny" id="clear">清空</button>
  </div>

  <div class="list" id="list"></div>

  <footer class="foot">
    <span>单文件 · 零依赖 · 图片不上传</span>
    <span>
      <a href="https://github.com/bushimashen/image-compressor" target="_blank" rel="noopener">GitHub</a>
      · <a href="https://gitee.com/codegoder/image-compressor" target="_blank" rel="noopener">Gitee</a>
    </span>
  </footer>
</div>

<div class="mask" id="mask" hidden>
  <div class="modal">
    <h3 id="cmpTitle">压缩前后对比</h3>
    <div class="cmp" id="cmp">
      <img id="cmpBefore" alt="原图" />
      <div class="after" id="cmpAfterWrap"><img id="cmpAfter" alt="压缩后" /></div>
      <div class="bar" id="cmpBar"></div>
      <span class="tag l">原图</span>
      <span class="tag r">压缩后</span>
    </div>
    <table class="fmt-table">
      <thead><tr><th>格式</th><th>当前设置下的大小</th></tr></thead>
      <tbody id="cmpRows"></tbody>
    </table>
    <div style="margin-top:14px;text-align:right">
      <button class="btn" id="cmpClose">关闭</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id)
const el = {
  fmt: $('fmt'), dim: $('dim'), q: $('q'), qVal: $('qVal'),
  tOn: $('tOn'), tKB: $('tKB'),
  drop: $('drop'), file: $('file'), addBtn: $('addBtn'),
  summary: $('summary'), sCount: $('sCount'), sOrig: $('sOrig'),
  sOut: $('sOut'), sSave: $('sSave'), dlAll: $('dlAll'), clear: $('clear'),
  list: $('list'),
  mask: $('mask'), cmpTitle: $('cmpTitle'), cmp: $('cmp'),
  cmpBefore: $('cmpBefore'), cmpAfter: $('cmpAfter'), cmpAfterWrap: $('cmpAfterWrap'),
  cmpBar: $('cmpBar'), cmpRows: $('cmpRows'), cmpClose: $('cmpClose')
}

const EXT = { 'image/jpeg': 'jpg', 'image/webp': 'webp', 'image/png': 'png' }
const FMT_LABEL = { 'image/jpeg': 'JPG', 'image/webp': 'WebP', 'image/png': 'PNG' }

let items = []
let uid = 0
let runSeq = 0
let genTimer = 0
let webpOk = true
let cmpHit = null

/* ---------- WebP 编码支持：Safari 会静默回退成 PNG，必须验 blob.type ---------- */
function detectWebp() {
  const c = document.createElement('canvas')
  c.width = c.height = 1
  c.toBlob((b) => { webpOk = !!(b && b.type === 'image/webp') }, 'image/webp', 0.5)
}

function fmtSize(n) {
  if (!n) return '0 KB'
  if (n < 1024) return n + ' B'
  if (n < 1048576) return (n / 1024).toFixed(1) + ' KB'
  return (n / 1048576).toFixed(2) + ' MB'
}

/* ---------- 解码：优先 createImageBitmap 并烘焙 EXIF 方向，手机竖拍才不会转错 ---------- */
function decode(file) {
  if (window.createImageBitmap) {
    return createImageBitmap(file, { imageOrientation: 'from-image' })
      .catch(() => decodeViaImg(file))
  }
  return decodeViaImg(file)
}
function decodeViaImg(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file)
    const img = new Image()
    img.onload = () => resolve(img)
    img.onerror = reject
    img.src = url
  })
}

async function addFiles(fileList) {
  const files = [...(fileList || [])].filter((f) => f && f.type.startsWith('image/'))
  for (const f of files) {
    let bmp = null
    try { bmp = await decode(f) } catch (e) { continue }
    if (!bmp) continue
    items.push({
      id: ++uid,
      name: f.name || `粘贴图片-${uid}.png`,
      file: f,
      bmp,
      origUrl: URL.createObjectURL(f),
      origW: bmp.width, origH: bmp.height, origSize: f.size,
      status: 'wait', outUrl: '', outSize: 0, outW: 0, outH: 0, outFmt: '',
      usedQ: 0, hasAlpha: null, tip: ''
    })
    renderList()
  }
  scheduleAll()
}

/* ---------- 设置变更统一重压（节流 120ms，避免拖滑块时疯狂重编码） ---------- */
function scheduleAll() {
  clearTimeout(genTimer)
  genTimer = setTimeout(runAll, 120)
}
async function runAll() {
  const seq = ++runSeq
  for (const it of items) {
    if (seq !== runSeq) return
    await runItem(it, seq)
  }
  renderSummary()
}

function resolveFormat(it) {
  const src = it.file.type || ''
  let f
  if (['image/jpeg', 'image/webp', 'image/png'].includes(el.fmt.value)) f = el.fmt.value
  else if (el.fmt.value === 'keep') f = ['image/jpeg', 'image/webp', 'image/png'].includes(src) ? src : 'image/jpeg'
  else f = (src === 'image/png' || src === 'image/webp') ? 'image/webp' : 'image/jpeg'
  if (f === 'image/webp' && !webpOk) f = 'image/jpeg'
  return f
}

function renderToCanvas(it) {
  let w = it.origW, h = it.origH
  const maxDim = Number(el.dim.value) || 0
  if (maxDim > 0 && Math.max(w, h) > maxDim) {
    const k = maxDim / Math.max(w, h)
    w = Math.max(1, Math.round(w * k))
    h = Math.max(1, Math.round(h * k))
  }
  const c = document.createElement('canvas')
  c.width = w; c.height = h
  const ctx = c.getContext('2d')
  ctx.imageSmoothingEnabled = true
  ctx.imageSmoothingQuality = 'high'
  ctx.drawImage(it.bmp, 0, 0, w, h)
  return { c, ctx, w, h }
}

/* 透明检测：抽行扫描（最多 400×400 个采样点），够快也够准 */
function detectAlpha(ctx, w, h) {
  try {
    const d = ctx.getImageData(0, 0, w, h).data
    const sy = Math.max(1, Math.floor(h / 400))
    const sx = Math.max(1, Math.floor(w / 400))
    for (let y = 0; y < h; y += sy) {
      for (let x = 0; x < w; x += sx) {
        if (d[(y * w + x) * 4 + 3] < 250) return true
      }
    }
  } catch (e) { /* 跨域画布等异常按不透明处理 */ }
  return false
}

function toBlob(canvas, fmt, q) {
  return new Promise((resolve, reject) => {
    canvas.toBlob((b) => (b ? resolve(b) : reject(new Error('encode failed'))), fmt, q)
  })
}

async function runItem(it, seq) {
  it.status = 'work'
  it.tip = ''
  renderRow(it)
  try {
    const fmt = resolveFormat(it)
    let { c, ctx, w, h } = renderToCanvas(it)
    let tip = ''

    // JPG 不支持透明：检测到 alpha 就垫白底合成，否则透明区会变黑
    if (fmt === 'image/jpeg') {
      if (it.hasAlpha === null) it.hasAlpha = detectAlpha(ctx, w, h)
      if (it.hasAlpha) {
        const flat = document.createElement('canvas')
        flat.width = w; flat.height = h
        const fx = flat.getContext('2d')
        fx.fillStyle = '#ffffff'
        fx.fillRect(0, 0, w, h)
        fx.drawImage(c, 0, 0)
        c = flat; ctx = fx
        tip = '透明区域已按白底合成（JPG 不支持透明）'
      }
    }

    let blob, usedQ
    const targetKB = el.tOn.checked ? (Number(el.tKB.value) || 0) : 0

    if (targetKB > 0 && fmt !== 'image/png') {
      // 二分质量逼近目标体积；PNG 质量参数无意义，跳过
      const goal = targetKB * 1024
      let lo = 0.05, hi = 0.95, best = null
      for (let i = 0; i < 8; i++) {
        if (seq !== runSeq) return
        const mid = (lo + hi) / 2
        const b = await toBlob(c, fmt, mid)
        if (b.size <= goal) { best = { b, q: mid }; lo = mid } else { hi = mid }
        if (hi - lo < 0.04) break
      }
      if (best) {
        blob = best.b; usedQ = best.q
        if (blob.size > goal) tip = '已压到最低质量，仍略大于目标体积'
      } else {
        blob = await toBlob(c, fmt, 0.05); usedQ = 0.05
        tip = '目标体积过小，已用最低质量输出'
      }
    } else {
      usedQ = fmt === 'image/png' ? 1 : Number(el.q.value) / 100
      blob = await toBlob(c, fmt, usedQ)
    }

    if (fmt === 'image/png') {
      if (it.hasAlpha === null) it.hasAlpha = detectAlpha(ctx, w, h)
      if (!it.hasAlpha && it.origSize > 100 * 1024) {
        tip = '这张图没有透明通道，换 WebP 或 JPG 体积通常能再降一半以上'
      }
    }

    if (seq !== runSeq) return
    if (it.outUrl) URL.revokeObjectURL(it.outUrl)
    it.outUrl = URL.createObjectURL(blob)
    it.outSize = blob.size
    it.outW = w; it.outH = h; it.outFmt = fmt
    it.usedQ = usedQ
    it.tip = tip
    it.status = 'done'
  } catch (e) {
    it.status = 'error'
  }
  renderRow(it)
  renderSummary()
}

/* ---------- 渲染 ---------- */
function rowHtml(it) {
  const pct = it.status === 'done' && it.origSize
    ? Math.round((1 - it.outSize / it.origSize) * 100) : 0
  const badge = it.status === 'work' ? '<span class="badge work">处理中</span>'
    : it.status === 'error' ? '<span class="badge err">失败</span>'
    : it.status === 'done' ? `<span class="badge">${FMT_LABEL[it.outFmt] || ''}</span>` : ''
  const nums = it.status === 'done'
    ? `${fmtSize(it.origSize)}<span class="arrow">→</span><span class="out">${fmtSize(it.outSize)}</span>
       <span class="pct">${pct >= 0 ? '省 ' + pct + '%' : '增 ' + (-pct) + '%'}</span>
       <span style="color:var(--muted)"> · ${it.outW}×${it.outH}</span>`
    : `${fmtSize(it.origSize)} · ${it.origW}×${it.origH}`
  return `
    <div class="thumb"><img src="${it.outUrl || it.origUrl}" alt="" loading="lazy" /></div>
    <div class="meta">
      <div class="name" title="${escapeHtml(it.name)}">${escapeHtml(it.name)}${badge}</div>
      <div class="nums">${nums}</div>
      ${it.tip ? `<div class="tip">${escapeHtml(it.tip)}</div>` : ''}
    </div>
    <div class="acts">
      <button class="btn tiny" data-act="cmp" ${it.status !== 'done' ? 'disabled' : ''}>对比</button>
      <button class="btn tiny" data-act="dl" ${it.status !== 'done' ? 'disabled' : ''}>下载</button>
      <button class="btn tiny" data-act="rm">×</button>
    </div>`
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]))
}

function renderList() {
  el.list.innerHTML = ''
  for (const it of items) {
    const d = document.createElement('div')
    d.className = 'item'
    d.dataset.id = it.id
    d.innerHTML = rowHtml(it)
    d.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-act]')
      if (!b) return
      const act = b.dataset.act
      if (act === 'rm') removeItem(it)
      else if (act === 'dl') downloadOne(it)
      else if (act === 'cmp') openCompare(it)
    })
    el.list.appendChild(d)
  }
  renderSummary()
}

function renderRow(it) {
  const d = el.list.querySelector(`.item[data-id="${it.id}"]`)
  if (!d) return
  d.innerHTML = rowHtml(it)
}

function renderSummary() {
  const done = items.filter((i) => i.status === 'done')
  el.summary.hidden = items.length === 0
  if (!items.length) return
  const orig = done.reduce((s, i) => s + i.origSize, 0)
  const out = done.reduce((s, i) => s + i.outSize, 0)
  el.sCount.textContent = done.length
  el.sOrig.textContent = fmtSize(orig)
  el.sOut.textContent = fmtSize(out)
  el.sSave.textContent = orig ? Math.max(0, Math.round((1 - out / orig) * 100)) + '%' : '0%'
}

/* ---------- 对比弹窗 ---------- */
async function openCompare(it) {
  cmpHit = it
  el.cmpTitle.textContent = it.name
  el.cmpBefore.src = it.origUrl
  el.cmpAfter.src = it.outUrl
  setCmpPos(50)
  el.cmpRows.innerHTML = '<tr><td colspan="2">计算中…</td></tr>'
  el.mask.hidden = false

  // 用同样的尺寸重画一遍，按三种格式各编码一次，给出直观的体积对比
  const { c } = renderToCanvas(it)
  const q = Number(el.q.value) / 100
  const rows = []
  for (const f of ['image/jpeg', 'image/webp', 'image/png']) {
    try {
      const b = await toBlob(c, f, f === 'image/png' ? undefined : q)
      const real = (f === 'image/webp' && b.type !== 'image/webp') ? null : b.size
      rows.push({ label: FMT_LABEL[f], size: real })
    } catch (e) {
      rows.push({ label: FMT_LABEL[f], size: null })
    }
  }
  if (cmpHit !== it) return
  el.cmpRows.innerHTML = rows.map((r) => `
    <tr><td>${r.label}</td><td class="n">${r.size === null ? '不支持' : fmtSize(r.size)}</td></tr>
  `).join('') + `<tr><td><b>当前输出</b></td><td class="n"><b>${fmtSize(it.outSize)}</b></td></tr>`
}

function setCmpPos(pct) {
  el.cmpAfterWrap.style.clipPath = `inset(0 0 0 ${pct}%)`
  el.cmpBar.style.left = pct + '%'
}

let cmpDragging = false
function moveCmp(clientX) {
  const r = el.cmp.getBoundingClientRect()
  if (!r.width) return
  setCmpPos(Math.min(100, Math.max(0, ((clientX - r.left) / r.width) * 100)))
}
el.cmp.addEventListener('pointerdown', (e) => { cmpDragging = true; moveCmp(e.clientX) })
window.addEventListener('pointermove', (e) => { if (cmpDragging) moveCmp(e.clientX) })
window.addEventListener('pointerup', () => { cmpDragging = false })
el.cmpClose.addEventListener('click', () => { el.mask.hidden = true; cmpHit = null })
el.mask.addEventListener('click', (e) => { if (e.target === el.mask) { el.mask.hidden = true; cmpHit = null } })

/* ---------- 下载 / 删除 ---------- */
function downloadOne(it) {
  if (it.status !== 'done') return
  const base = it.name.replace(/\.[^.]+$/, '')
  const a = document.createElement('a')
  a.href = it.outUrl
  a.download = `${base}-压缩.${EXT[it.outFmt] || 'img'}`
  a.click()
}
async function downloadAll() {
  for (const it of items.filter((i) => i.status === 'done')) {
    downloadOne(it)
    // 连点触发下载会被浏览器吞掉，必须留间隔
    await new Promise((r) => setTimeout(r, 350))
  }
}
function removeItem(it) {
  URL.revokeObjectURL(it.origUrl)
  if (it.outUrl) URL.revokeObjectURL(it.outUrl)
  items = items.filter((i) => i !== it)
  renderList()
  scheduleAll()
}
function clearAll() {
  for (const it of items) {
    URL.revokeObjectURL(it.origUrl)
    if (it.outUrl) URL.revokeObjectURL(it.outUrl)
  }
  items = []
  renderList()
}

/* ---------- 事件绑定 ---------- */
el.addBtn.addEventListener('click', () => el.file.click())
el.drop.addEventListener('click', () => el.file.click())
el.file.addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = '' })

el.drop.addEventListener('dragover', (e) => { e.preventDefault(); el.drop.classList.add('drag') })
el.drop.addEventListener('dragleave', () => el.drop.classList.remove('drag'))
el.drop.addEventListener('drop', (e) => {
  e.preventDefault()
  el.drop.classList.remove('drag')
  addFiles(e.dataTransfer && e.dataTransfer.files)
})
window.addEventListener('paste', (e) => {
  const imgs = [...((e.clipboardData && e.clipboardData.items) || [])]
    .filter((i) => i.type.startsWith('image/'))
    .map((i) => i.getAsFile())
    .filter(Boolean)
  if (imgs.length) addFiles(imgs)
})

el.q.addEventListener('input', () => { el.qVal.textContent = el.q.value; scheduleAll() })
el.fmt.addEventListener('change', scheduleAll)
el.dim.addEventListener('change', scheduleAll)
el.tOn.addEventListener('change', scheduleAll)
el.tKB.addEventListener('change', scheduleAll)
el.dlAll.addEventListener('click', downloadAll)
el.clear.addEventListener('click', clearAll)

detectWebp()
renderSummary()
</script>
</body>
</html>
